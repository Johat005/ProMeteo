[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometeo"
version = "0.1.0"
description = "ProMeteo: C3S seasonal NetCDF to CPT+ v10+ converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cdsapi>=0.7.7",
    "cftime>=1.6",
    "netCDF4>=1.6",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "xarray>=2023.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
prometeo = "prometeo.cli.main:main"

[project.urls]
Repository = "https://github.com/Johat005/ProMeteo"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prometeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["prometeo"]
mypy_path = "src"
